AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  EWB student lab: two non-overlapping VPCs, one bastion, two private EC2
  workloads, VPC peering, explicit subnet route tables, and restricted ingress.

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair name in this Region. Keep the private key locally.
  MyPublicCidr:
    Type: String
    Description: Your current public IPv4 with /32, e.g. 203.0.113.7/32. Never use 0.0.0.0/0.
    AllowedPattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])/32$'
    ConstraintDescription: Enter one IPv4 address followed by /32.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro]
    Description: Select an instructor-approved type; check current pricing first.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI for this Region.

  EnablePeering:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Keep false for the baseline ping; update to true after capturing it.

Conditions:
  CreatePeering: !Equals [!Ref EnablePeering, 'true']

Resources:
  VpcA:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: ewb-vpc-a}, {Key: Project, Value: EWB-VPC-Peering}]
  VpcB:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: ewb-vpc-b}, {Key: Project, Value: EWB-VPC-Peering}]

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcA
      CidrBlock: 10.10.1.0/24
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: ewb-a-public}, {Key: Project, Value: EWB-VPC-Peering}]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcA
      CidrBlock: 10.10.2.0/24
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: ewb-a-private}, {Key: Project, Value: EWB-VPC-Peering}]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcB
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: ewb-b-private}, {Key: Project, Value: EWB-VPC-Peering}]

  InternetGatewayA:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: ewb-igw-a}, {Key: Project, Value: EWB-VPC-Peering}]
  AttachGatewayA:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpcA
      InternetGatewayId: !Ref InternetGatewayA

  RouteTablePublicA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcA
      Tags: [{Key: Name, Value: ewb-rt-a-public}, {Key: Project, Value: EWB-VPC-Peering}]
  RouteTablePrivateA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcA
      Tags: [{Key: Name, Value: ewb-rt-a-private}, {Key: Project, Value: EWB-VPC-Peering}]
  RouteTablePrivateB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcB
      Tags: [{Key: Name, Value: ewb-rt-b-private}, {Key: Project, Value: EWB-VPC-Peering}]
  AssocPublicA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref RouteTablePublicA}
  AssocPrivateA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref RouteTablePrivateA}
  AssocPrivateB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref RouteTablePrivateB}
  DefaultRoutePublicA:
    Type: AWS::EC2::Route
    DependsOn: AttachGatewayA
    Properties:
      RouteTableId: !Ref RouteTablePublicA
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayA

  PeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: CreatePeering
    Properties:
      VpcId: !Ref VpcA
      PeerVpcId: !Ref VpcB
      Tags: [{Key: Name, Value: ewb-a-b-peer}, {Key: Project, Value: EWB-VPC-Peering}]

  PeerRoutePrivateA:
    Type: AWS::EC2::Route
    Condition: CreatePeering
    Properties:
      RouteTableId: !Ref RouteTablePrivateA
      DestinationCidrBlock: 10.20.0.0/16
      VpcPeeringConnectionId: !Ref PeeringConnection
  PeerRoutePrivateB:
    Type: AWS::EC2::Route
    Condition: CreatePeering
    Properties:
      RouteTableId: !Ref RouteTablePrivateB
      DestinationCidrBlock: 10.10.0.0/16
      VpcPeeringConnectionId: !Ref PeeringConnection
  PeerRoutePublicA:
    Type: AWS::EC2::Route
    Condition: CreatePeering
    Properties:
      RouteTableId: !Ref RouteTablePublicA
      DestinationCidrBlock: 10.20.0.0/16
      VpcPeeringConnectionId: !Ref PeeringConnection

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH only from the student current public IPv4 /32.
      VpcId: !Ref VpcA
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref MyPublicCidr, Description: Student laptop SSH}
      Tags: [{Key: Name, Value: ewb-sg-bastion}, {Key: Project, Value: EWB-VPC-Peering}]
  AppASecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from bastion; ICMP echo from App-B only.
      VpcId: !Ref VpcA
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 10.10.1.10/32, Description: Bastion SSH}
        - {IpProtocol: icmp, FromPort: 8, ToPort: 0, CidrIp: 10.20.1.10/32, Description: App-B echo request}
      Tags: [{Key: Name, Value: ewb-sg-app-a}, {Key: Project, Value: EWB-VPC-Peering}]
  AppBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from bastion; ICMP echo from App-A only.
      VpcId: !Ref VpcB
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 10.10.1.10/32, Description: Bastion SSH}
        - {IpProtocol: icmp, FromPort: 8, ToPort: 0, CidrIp: 10.10.2.10/32, Description: App-A echo request}
      Tags: [{Key: Name, Value: ewb-sg-app-b}, {Key: Project, Value: EWB-VPC-Peering}]

  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          SubnetId: !Ref PublicSubnetA
          PrivateIpAddress: 10.10.1.10
          GroupSet: [!Ref BastionSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 8, VolumeType: gp3, DeleteOnTermination: true, Encrypted: true}
      Tags: [{Key: Name, Value: ewb-bastion}, {Key: Project, Value: EWB-VPC-Peering}]
  AppAInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      NetworkInterfaces:
        - DeviceIndex: '0'
          DeleteOnTermination: true
          SubnetId: !Ref PrivateSubnetA
          PrivateIpAddress: 10.10.2.10
          GroupSet: [!Ref AppASecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 8, VolumeType: gp3, DeleteOnTermination: true, Encrypted: true}
      Tags: [{Key: Name, Value: ewb-app-a}, {Key: Project, Value: EWB-VPC-Peering}]
  AppBInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      NetworkInterfaces:
        - DeviceIndex: '0'
          DeleteOnTermination: true
          SubnetId: !Ref PrivateSubnetB
          PrivateIpAddress: 10.20.1.10
          GroupSet: [!Ref AppBSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 8, VolumeType: gp3, DeleteOnTermination: true, Encrypted: true}
      Tags: [{Key: Name, Value: ewb-app-b}, {Key: Project, Value: EWB-VPC-Peering}]

Outputs:
  VpcAId: {Description: VPC A ID, Value: !Ref VpcA}
  VpcBId: {Description: VPC B ID, Value: !Ref VpcB}
  PeeringConnectionId:
    Condition: CreatePeering
    Description: VPC peering connection ID
    Value: !Ref PeeringConnection
  BastionInstanceId: {Description: Bastion EC2 instance ID, Value: !Ref BastionInstance}
  BastionPublicIp: {Description: Bastion public IPv4 for SSH configuration, Value: !GetAtt BastionInstance.PublicIp}
  AppAInstanceId: {Description: Private App-A instance ID, Value: !Ref AppAInstance}
  AppBInstanceId: {Description: Private App-B instance ID, Value: !Ref AppBInstance}
  PrivateAppAIp: {Description: App-A private IPv4, Value: 10.10.2.10}
  PrivateAppBIp: {Description: App-B private IPv4, Value: 10.20.1.10}
